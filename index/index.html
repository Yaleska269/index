<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Gatos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f5f5;
        }

        .container {
            margin-top: 30px;
        }

        .card {
            border-radius: 15px;
        }

        .gato-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
        }

        #btnCancelar {
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1 class="text-center mb-4">Registro de Gatos</h1>

        <div class="row">

            <!-- FORMULARIO -->
            <div class="col-md-5">

                <div class="card p-4 shadow">

                    <h3 id="tituloFormulario">Registrar Gato</h3>

                    <form id="formGato">

                        <input type="hidden" id="gatoId">

                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" id="nombre" name="nombre" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Edad</label>
                            <input type="number" id="edad" name="edad" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Peso</label>
                            <input type="number" step="0.01" id="peso" name="peso" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Raza</label>
                            <input type="text" id="raza" name="raza" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Imagen</label>
                            <input type="file" id="imagen" name="imagen" class="form-control" accept="image/*">
                        </div>

                        <div class="mb-3">
                            <img id="preview" src="" alt="Vista previa"
                                style="display:none; width:100%; max-height:250px; object-fit:cover; border-radius:10px;">
                        </div>

                        <button type="submit" id="btnGuardar" class="btn btn-primary w-100">
                            Registrar Gato
                        </button>

                        <button type="button" id="btnCancelar" class="btn btn-secondary w-100 mt-2">
                            Cancelar edición
                        </button>

                    </form>

                    <div id="resultado" class="mt-3"></div>

                </div>
            </div>


            <!-- LISTA DE GATOS -->
            <div class="col-md-7">

                <div class="d-flex justify-content-between align-items-center mb-3">

                    <h3>Gatos registrados</h3>

                    <button class="btn btn-success" onclick="cargarGatos()">
                        Actualizar
                    </button>

                </div>

                <div id="listaGatos" class="row g-3"></div>

            </div>

        </div>
    </div>


    <script>

        // =====================================================
        // URL DEL BACKEND
        // =====================================================

        const BACKEND_URL = "https://backend-gatos-8zff.onrender.com";


        const formGato = document.getElementById("formGato");
        const gatoId = document.getElementById("gatoId");
        const nombre = document.getElementById("nombre");
        const edad = document.getElementById("edad");
        const peso = document.getElementById("peso");
        const raza = document.getElementById("raza");
        const imagen = document.getElementById("imagen");
        const preview = document.getElementById("preview");
        const btnGuardar = document.getElementById("btnGuardar");
        const btnCancelar = document.getElementById("btnCancelar");
        const tituloFormulario = document.getElementById("tituloFormulario");
        const resultado = document.getElementById("resultado");
        const listaGatos = document.getElementById("listaGatos");


        // =====================================================
        // VISTA PREVIA DE IMAGEN
        // =====================================================

        imagen.addEventListener("change", function () {

            const archivo = imagen.files[0];

            if (archivo) {

                const url = URL.createObjectURL(archivo);

                preview.src = url;
                preview.style.display = "block";

            } else {

                preview.src = "";
                preview.style.display = "none";

            }

        });


        // =====================================================
        // REGISTRAR O ACTUALIZAR GATO
        // =====================================================

        formGato.addEventListener("submit", async function (e) {

            e.preventDefault();

            try {

                const formData = new FormData();

                formData.append("nombre", nombre.value);
                formData.append("edad", edad.value);
                formData.append("peso", peso.value);
                formData.append("raza", raza.value);


                // Si hay una imagen seleccionada

                if (imagen.files.length > 0) {

                    formData.append("imagen", imagen.files[0]);

                }


                // =================================================
                // SI EXISTE ID = ACTUALIZAR
                // =================================================

                if (gatoId.value) {

                    const response = await fetch(
                        `${BACKEND_URL}/gato/${gatoId.value}`,
                        {
                            method: "PUT",
                            body: formData
                        }
                    );


                    const data = await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.mensaje || "Error al actualizar"
                        );

                    }


                    resultado.innerHTML = `
                        <div class="alert alert-success">
                            ${data.mensaje}
                        </div>
                    `;

                }


                // =================================================
                // SI NO EXISTE ID = REGISTRAR
                // =================================================

                else {

                    if (imagen.files.length === 0) {

                        resultado.innerHTML = `
                            <div class="alert alert-danger">
                                La imagen del gato es obligatoria.
                            </div>
                        `;

                        return;

                    }


                    const response = await fetch(
                        `${BACKEND_URL}/gato`,
                        {
                            method: "POST",
                            body: formData
                        }
                    );


                    const data = await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.mensaje || "Error al registrar"
                        );

                    }


                    resultado.innerHTML = `
                        <div class="alert alert-success">
                            ${data.mensaje}
                        </div>
                    `;

                }


                limpiarFormulario();

                cargarGatos();

            } catch (error) {

                console.error(error);

                resultado.innerHTML = `
                    <div class="alert alert-danger">
                        ${error.message}
                    </div>
                `;

            }

        });


        // =====================================================
        // OBTENER TODOS LOS GATOS
        // =====================================================

        async function cargarGatos() {

            try {

                listaGatos.innerHTML = `
                    <div class="text-center">
                        Cargando gatos...
                    </div>
                `;


                const response = await fetch(
                    `${BACKEND_URL}/gatos`
                );


                const data = await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.mensaje || "Error al obtener los gatos"
                    );

                }


                const gatos = data.gatos;


                if (!gatos || gatos.length === 0) {

                    listaGatos.innerHTML = `
                        <div class="col-12">
                            <div class="alert alert-info">
                                No hay gatos registrados.
                            </div>
                        </div>
                    `;

                    return;

                }


                // =================================================
                // TARJETAS DE LOS GATOS
                // =================================================

                listaGatos.innerHTML = gatos.map(gato => `
                    <div class="col-12 col-sm-6 col-xl-4">

                        <div class="card gato-card h-100">

                            <img
                                src="${gato.imagenUrl}"
                                class="card-img-top gato-img"
                                alt="${gato.nombre}"
                                onerror="this.src='https://placehold.co/400x300?text=Sin+imagen'"
                            >

                            <div class="card-body d-flex flex-column">

                                <h5 class="card-title mb-1">
                                    ${gato.nombre}
                                </h5>

                                <p class="card-text mb-1">
                                    <small class="text-muted">
                                        ${gato.raza} · ${gato.edad} años · ${gato.peso} kg
                                    </small>
                                </p>

                                <p class="card-text">
                                    <small class="text-muted">
                                        Registrado:
                                        ${new Date(gato.fecha).toLocaleDateString('es-ES')}
                                    </small>
                                </p>

                                <div class="mt-auto d-flex gap-2">

                                    <button
                                        class="btn btn-sm btn-outline-primary flex-fill"
                                        onclick='editarGato(${JSON.stringify(gato)})'
                                    >
                                        Actualizar
                                    </button>

                                    <button
                                        class="btn btn-sm btn-outline-danger flex-fill"
                                        onclick="eliminarGato('${gato.id}', '${gato.nombre}')"
                                    >
                                        Eliminar
                                    </button>

                                </div>

                            </div>

                        </div>

                    </div>
                `).join("");

            } catch (error) {

                console.error(error);

                listaGatos.innerHTML = `
                    <div class="col-12">
                        <div class="alert alert-danger">
                            Error al cargar los gatos:
                            ${error.message}
                        </div>
                    </div>
                `;

            }

        }


        // =====================================================
        // EDITAR GATO
        // =====================================================

        function editarGato(gato) {

            gatoId.value = gato.id;
            nombre.value = gato.nombre;
            edad.value = gato.edad;
            peso.value = gato.peso;
            raza.value = gato.raza;

            tituloFormulario.textContent = "Editar Gato";

            btnGuardar.textContent = "Actualizar Gato";

            btnGuardar.classList.remove("btn-primary");
            btnGuardar.classList.add("btn-warning");

            btnCancelar.style.display = "block";


            if (gato.imagenUrl) {

                preview.src = gato.imagenUrl;
                preview.style.display = "block";

            }


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }


        // =====================================================
        // ELIMINAR GATO
        // =====================================================

        async function eliminarGato(id, nombre) {

            const confirmar = confirm(
                `¿Estás seguro de eliminar a "${nombre}"?`
            );

            if (!confirmar) return;


            try {

                const respuesta = await fetch(
                    `${BACKEND_URL}/gato/${id}`,
                    {
                        method: "DELETE"
                    }
                );


                const data = await respuesta.json();


                if (respuesta.ok) {

                    alert(data.mensaje);

                    cargarGatos();

                } else {

                    alert(
                        data.mensaje || "Error al eliminar el gato"
                    );

                }

            } catch (error) {

                console.error(error);

                alert("Error de conexión con el servidor.");

            }

        }


        // =====================================================
        // CANCELAR EDICIÓN
        // =====================================================

        btnCancelar.addEventListener("click", function () {

            limpiarFormulario();

        });


        // =====================================================
        // LIMPIAR FORMULARIO
        // =====================================================

        function limpiarFormulario() {

            formGato.reset();

            gatoId.value = "";

            preview.src = "";
            preview.style.display = "none";

            tituloFormulario.textContent = "Registrar Gato";

            btnGuardar.textContent = "Registrar Gato";

            btnGuardar.classList.remove("btn-warning");
            btnGuardar.classList.add("btn-primary");

            btnCancelar.style.display = "none";

        }


        // =====================================================
        // CARGAR GATOS AL ABRIR LA PÁGINA
        // =====================================================

        cargarGatos();

    </script>

</body>

</html>
