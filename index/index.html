<title>Registro de Gato</title>

<!-- Bootstrap -->
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

<style>
    body {
        background: linear-gradient(135deg, #dbeafe, #ede9fe);
        min-height: 100vh;
        display: flex;
        align-items: center;
    }

    .card {
        border: none;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
    }

    .titulo {
        color: #4f46e5;
        font-weight: 700;
    }

    .subtitulo {
        color: #6b7280;
        font-size: 0.95rem;
    }

    .btn-registrar {
        background: #4f46e5;
        border: none;
        border-radius: 10px;
        padding: 12px;
        font-weight: 600;
    }

    .btn-registrar:hover {
        background: #4338ca;
    }

    .form-control {
        border-radius: 10px;
        padding: 11px;
    }

    #resultado {
        display: none;
    }

    .icono {
        font-size: 45px;
    }
</style>
```

</head>

<body>

```
<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6 col-lg-5">

            <div class="card p-4">

                <div class="text-center mb-4">

                    <div class="icono">🐱</div>

                    <h2 class="titulo">Registro de Gato</h2>

                    <p class="subtitulo">
                        Ingresa los datos de tu gato
                    </p>

                </div>

                <form id="formGato">

                    <!-- Nombre -->
                    <div class="mb-3">
                        <label for="nombre" class="form-label">
                            Nombre
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="nombre"
                            placeholder="Ej: Michi"
                            required>
                    </div>

                    <!-- Edad -->
                    <div class="mb-3">
                        <label for="edad" class="form-label">
                            Edad (años)
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            id="edad"
                            min="0"
                            step="0.1"
                            placeholder="Ej: 2.5"
                            required>
                    </div>

                    <!-- Peso -->
                    <div class="mb-3">
                        <label for="peso" class="form-label">
                            Peso (kg)
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            id="peso"
                            min="0"
                            step="0.1"
                            placeholder="Ej: 4.2"
                            required>
                    </div>

                    <!-- Raza -->
                    <div class="mb-3">
                        <label for="raza" class="form-label">
                            Raza
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="raza"
                            placeholder="Ej: Siamés"
                            required>
                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary btn-registrar w-100">

                        Registrar Gato 🐾

                    </button>

                </form>

                <!-- Resultado del backend -->
                <div
                    id="resultado"
                    class="alert mt-4"
                    role="alert">
                </div>

            </div>

        </div>

    </div>

</div>

<script>

    // URL de tu backend desplegado en Render
    const BACKEND_URL =
        "https://backend-gatos.onrender.com/gato";

    document
        .getElementById("formGato")
        .addEventListener("submit", async (e) => {

            e.preventDefault();

            const datos = {

                nombre:
                    document
                        .getElementById("nombre")
                        .value
                        .trim(),

                edad:
                    Number(
                        document
                            .getElementById("edad")
                            .value
                    ),

                peso:
                    Number(
                        document
                            .getElementById("peso")
                            .value
                    ),

                raza:
                    document
                        .getElementById("raza")
                        .value
                        .trim()
            };

            const resultadoDiv =
                document.getElementById("resultado");

            resultadoDiv.style.display = "none";

            try {

                const respuesta =
                    await fetch(BACKEND_URL, {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(datos)
                    });

                const data =
                    await respuesta.json();

                if (respuesta.ok) {

                    resultadoDiv.className =
                        "alert alert-success mt-4";

                    resultadoDiv.textContent =
                        data.mensaje;

                } else {

                    resultadoDiv.className =
                        "alert alert-danger mt-4";

                    resultadoDiv.textContent =
                        data.mensaje ||
                        "Error al registrar el gato";
                }

                resultadoDiv.style.display =
                    "block";

            } catch (error) {

                resultadoDiv.className =
                    "alert alert-danger mt-4";

                resultadoDiv.textContent =
                    "Error de conexión con el servidor.";

                resultadoDiv.style.display =
                    "block";
            }

        });

</script>
```

</body>

</html>
